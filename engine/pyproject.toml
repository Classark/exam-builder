[project]
name = "qbx"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    # 2.0, not 1.28: 1.28's redaction rewrote "Td" as "TD", resetting the leading, so text
    # after a "T*" jumped lines in composed papers (0452/12 MJ26 Q2's table)
    "pymupdf>=2.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    # PyMuPDF 2.0 publishes no Intel Mac wheel, and its sdist builds "pymupdf-lite" - the
    # same core, without the 4llm and layout add-ons (and their onnxruntime, which has no
    # Intel Mac build at all). The engine uses neither; qbx/__init__.py sets the glyph
    # correction itself, so both read text alike.
    "pymupdf-lite>=2.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    # Not used directly (the Claude Code SDK -> mcp[crypto] -> pyjwt). cryptography 49+
    # publishes no Intel Mac wheel, so Intel builds compiled it against the build Mac's own
    # OpenSSL - and the app then needed that Mac's macOS (26 on the iMac, 15 on CI;
    # package.check_mac_minimum caught it). 48.0.1 is the last with one (universal2, 10.9+);
    # uv resolves one version for every platform, so all builds use 48.
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "pydantic>=2.13.5",
    "typer>=0.27.2",
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
    "python-multipart>=0.0.32",
    "claude-agent-sdk>=0.2.159",
    "pywebview>=6.2.1",
    "anthropic>=2.6.0",
    "keyring>=25.7.0",
]

[dependency-groups]
dev = [
    "dmgbuild>=1.6 ; sys_platform == 'darwin'",
    "httpx>=0.28.1",
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

